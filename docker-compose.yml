version: "3.9"

services:
  gr-agent:
    build: .
    container_name: gr-agent-poc
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./db:/app/db
      - ./app/data:/app/app/data
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  gr-agent-frontend:
    image: node:20-alpine
    container_name: gr-agent-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - gr-agent
