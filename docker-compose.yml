version: "3.9"

services:
  gr-agent:
    build: .
    container_name: gr-agent-poc
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./db:/app/db
      - ./app/data:/app/app/data
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
